# Ref: https://code.visualstudio.com/docs/setup/linux
- name: Import Microsoft GPG Key
  ansible.builtin.rpm_key:
    key: https://packages.microsoft.com/keys/microsoft.asc
    state: present
- name: Enable Visual Studio Code Repository
  ansible.builtin.copy:
    content: |
      [code]
      name=Visual Studio Code
      baseurl=https://packages.microsoft.com/yumrepos/vscode
      enabled=1
      autorefresh=1
      type=rpm-md
      gpgcheck=1
      gpgkey=https://packages.microsoft.com/keys/microsoft.asc
    dest: /etc/yum.repos.d/vscode.repo
    mode: u=rw,g=r,o=r
- name: Install Visual Studio Code
  ansible.builtin.dnf:
    name: code
    state: present

- name: Install Git
  ansible.builtin.dnf:
    name: git
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/language-package-managers/
- name: Install uv
  ansible.builtin.dnf:
    name: python3-uv
    state: present
- name: Install Node.js and npm
  ansible.builtin.dnf:
    name:
      - nodejs
      - npm
    state: present
- name: Install Go
  ansible.builtin.dnf:
    name: golang
    state: present

- name: Install Ansible
  ansible.builtin.dnf:
    name: ansible-core
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/installing-docker/
- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-cli
      - containerd
    state: present
- name: Install Docker Compose
  ansible.builtin.dnf:
    name: docker-compose
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/using-kubernetes-versioned/
- name: Install Kubernetes Client
  ansible.builtin.dnf:
    name: kubernetes1.37-client
    state: present

- name: Install Helm
  ansible.builtin.dnf:
    name: helm
    state: present

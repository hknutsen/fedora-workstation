- name: Install GitHub CLI
  ansible.builtin.dnf:
    name: gh
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/language-package-managers/
- name: Install uv
  ansible.builtin.dnf:
    name: python3-uv
    state: present
- name: Install Node.js and npm
  ansible.builtin.dnf:
    name:
      - nodejs
      - npm
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/installing-docker/
- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-cli
      - containerd
    state: present
- name: Install Docker-Compose
  ansible.builtin.dnf:
    name: docker-compose
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/using-kubernetes-versioned/
- name: Install Kubernetes Client
  ansible.builtin.dnf:
    name: kubernetes-client
    state: present

- name: Install Helm
  ansible.builtin.dnf:
    name: helm
    state: present

- name: Install Azure CLI
  ansible.builtin.dnf:
    name: azure-cli
    state: present

# Ref: https://developer.hashicorp.com/terraform/install
- name: Import HashiCorp GPG Key
  ansible.builtin.rpm_key:
    key: https://rpm.releases.hashicorp.com/gpg
    state: present
    fingerprint: D55C 0D1A C78A 8D81 26CB 631C FC9C A96A CA02 6560
- name: Install HashiCorp Repository
  ansible.builtin.get_url:
    url: https://rpm.releases.hashicorp.com/fedora/hashicorp.repo
    dest: /etc/yum.repos.d/hashicorp.repo
    mode: u=rw,g=r,o=r
- name: Install Terraform
  ansible.builtin.dnf:
    name: terraform
    state: present

- name: Install Ansible
  ansible.builtin.dnf:
    name: ansible
    state: present

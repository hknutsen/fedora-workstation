- name: Install GitHub CLI
  ansible.builtin.dnf:
    name: gh
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/language-package-managers/
- name: Install uv
  ansible.builtin.dnf:
    name: python3-uv
    state: present
- name: Install Node.js and npm
  ansible.builtin.dnf:
    name:
      - nodejs
      - npm
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/installing-docker/
- name: Install Docker
  ansible.builtin.dnf:
    name:
      - docker-cli
      - containerd
    state: present
- name: Install Docker-Compose
  ansible.builtin.dnf:
    name: docker-compose
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/using-kubernetes-versioned/
- name: Install Kubernetes Client
  ansible.builtin.dnf:
    name: kubernetes-client
    state: present

- name: Install Helm
  ansible.builtin.dnf:
    name: helm
    state: present

- name: Install Azure CLI
  ansible.builtin.dnf:
    name: azure-cli
    state: present

- name: Install Ansible
  ansible.builtin.dnf:
    name: ansible
    state: present

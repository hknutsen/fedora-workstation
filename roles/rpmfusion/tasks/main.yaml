# Ref: https://rpmfusion.org/keys
- name: Install Distribution GPG Keys
  ansible.builtin.dnf5:
    name: distribution-gpg-keys
    state: present
- name: Import RPM Fusion Free GPG Key
  ansible.builtin.rpm_key:
    key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-free-fedora-{{ ansible_facts["distribution_major_version"] }}
    state: present
- name: Import RPM Fusion Nonfree GPG Key
  ansible.builtin.rpm_key:
    key: /usr/share/distribution-gpg-keys/rpmfusion/RPM-GPG-KEY-rpmfusion-nonfree-fedora-{{ ansible_facts["distribution_major_version"] }}
    state: present

# Ref: https://rpmfusion.org/Configuration
- name: Enable RPM Fusion Free Repository
  ansible.builtin.dnf5:
    name: https://mirrors.rpmfusion.org/free/fedora/rpmfusion-free-release-{{ ansible_facts["distribution_major_version"] }}.noarch.rpm
    state: present
- name: Enable RPM Fusion Nonfree Repository
  ansible.builtin.dnf5:
    name: https://mirrors.rpmfusion.org/nonfree/fedora/rpmfusion-nonfree-release-{{ ansible_facts["distribution_major_version"] }}.noarch.rpm
    state: present
- name: Enable OpenH264 Repository
  community.general.ini_file:
    path: /usr/share/dnf5/repos.d/fedora-cisco-openh264.repo
    section: fedora-cisco-openh264
    option: enabled
    value: 1
    create: false
    no_extra_spaces: true
- name: Install RPM Fusion AppStream Data
  ansible.builtin.dnf5:
    name: rpmfusion-*-appstream-data
    state: present

# Ref: https://rpmfusion.org/Howto/Multimedia
- name: Install FFmpeg
  ansible.builtin.dnf5:
    name: ffmpeg
    state: present
    allowerasing: true # Replace ffmpeg-free
- name: Install Multimedia Libraries
  ansible.builtin.dnf5:
    name: "@multimedia"
    state: present
    install_weak_deps: false
    exclude: PackageKit-gstreamer-plugin
- name: Install Mesa VA-API Drivers
  ansible.builtin.dnf5:
    name: mesa-va-drivers-freeworld
    state: present
- name: Install Mesa Vulkan Drivers
  ansible.builtin.dnf5:
    name: mesa-vulkan-drivers-freeworld
    state: present
    allowerasing: true # Replace mesa-vulkan-drivers
- name: Enable RPM Fusion Free Tainted Repository
  ansible.builtin.dnf5:
    name: rpmfusion-free-release-tainted
    state: present
- name: Install libdvdcss
  ansible.builtin.dnf5:
    name: libdvdcss
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/installing-and-running-vlc/
- name: Install VLC
  ansible.builtin.dnf5:
    name: vlc
    state: present

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/changing-hostname/
- name: Set Hostname
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
    use: systemd

# Ref: https://docs.fedoraproject.org/en-US/quick-docs/selinux-changing-states-and-modes/
- name: Install SELinux
  ansible.builtin.dnf:
    name:
      - libselinux
      - libselinux-utils
      - python3-libselinux
      - policycoreutils
      - selinux-policy
      - selinux-policy-targeted
      - grubby
    state: present
- name: Configure SELinux
  ansible.posix.selinux:
    policy: "{{ common_selinux_policy }}"
    state: "{{ common_selinux_state }}"

- name: Configure DNF
  ansible.builtin.copy:
    content: |
      [main]
      pkg_gpgcheck=True
      installonly_limit=3
      clean_requirements_on_remove=True
      best=True
      skip_if_unavailable=False
    dest: /etc/dnf/dnf.conf
    mode: u=rw,g=r,o=r

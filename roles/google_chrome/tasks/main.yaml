# Ref: https://docs.fedoraproject.org/en-US/quick-docs/installing-chromium-or-google-chrome-browsers/
- name: Install Third-Party Repositories
  ansible.builtin.dnf5:
    name: fedora-workstation-repositories
    state: present
- name: Enable Google Chrome Repository
  community.general.ini_file:
    path: /usr/share/dnf5/repos.d/google-chrome.repo
    section: google-chrome
    option: enabled
    value: 1
    create: false
    no_extra_spaces: true
- name: Install Google Chrome
  ansible.builtin.dnf5:
    name: google-chrome-stable
    state: present

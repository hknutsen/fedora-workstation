- name: Install Déjà Dup Backups
  ansible.builtin.dnf:
    name: deja-dup
    state: present

- name: Create Backup Drive Mount Point
  ansible.builtin.file:
    name: /mnt/Backup
    state: directory
    owner: root
    group: root
    mode: u=rwx,g=rwx,o=rwx

- name: Mount Backup Drive
  ansible.posix.mount:
    src: UUID={{ deja_dup_drive_uuid }}
    path: /mnt/Backup
    fstype: auto
    opts: nosuid,nodev,nofail,x-gvfs-show
    state: present

# Ref: https://help.gnome.org/system-admin-guide/dconf-custom-defaults.html
- name: Configure Default Déjà Dup Backups Settings
  ansible.builtin.copy:
    content: |
      [org/gnome/deja-dup]
      periodic=true
      periodic-period=7
      delete-after=90
      include-list=['$HOME']
      exclude-list=['$TRASH', '$DOWNLOAD']
      backend='drive'

      [org/gnome/deja-dup/drive]
      uuid='{{ deja_dup_drive_uuid }}'
    dest: /etc/dconf/db/local.d/deja-dup
    mode: u=rw,g=r,o=r
  notify:
    - Update System Databases

# Ref: https://help.gnome.org/system-admin-guide/dconf-lockdown.html
- name: Lock Down Déjà Dup Backups Settings
  ansible.builtin.copy:
    content: |
      /org/gnome/deja-dup/periodic
      /org/gnome/deja-dup/periodic-period
      /org/gnome/deja-dup/delete-after
      /org/gnome/deja-dup/include-list
      /org/gnome/deja-dup/exclude-list
      /org/gnome/deja-dup/backend
      /org/gnome/deja-dup/drive/uuid
    dest: /etc/dconf/db/local.d/locks/deja-dup
    mode: u=rw,g=r,o=r
  notify:
    - Update System Databases

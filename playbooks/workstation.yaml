- name: Set up Fedora Workstation
  hosts: workstation
  become: true
  roles:
    - common
    - rpmfusion
    - flatpak
    - deja_dup
    - development_tools
  tasks:
    - name: Install Visual Studio Code
      ansible.builtin.import_role:
        name: development_tools
        tasks_from: vscode.yaml

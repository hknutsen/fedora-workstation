# Optional uninstall of LibreOffice if another productivity suite is preferred
# (e.g., Microsoft 365 or Google Docs).
- name: Uninstall LibreOffice
  hosts: localhost
  become: true
  tasks:
    # Depends on LibreOffice.
    - name: Uninstall unoconv
      ansible.builtin.dnf:
        name: unoconv
        state: absent
        autoremove: true

    - name: Uninstall LibreOffice
      ansible.builtin.dnf:
        name: "@libreoffice"
        state: absent
        autoremove: true

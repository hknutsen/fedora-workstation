# Optional uninstall of LibreOffice if another productivity suite is preferred
# (e.g., Microsoft 365 or Google Docs).
- name: Uninstall LibreOffice
  hosts: localhost
  become: true
  tasks:
    # Depends on LibreOffice.
    - name: Uninstall unoconv
      ansible.builtin.dnf:
        name: unoconv
        state: absent

    - name: Uninstall LibreOffice
      ansible.builtin.dnf:
        name: "@libreoffice"
        state: absent
      notify:
        - Remove Packages Installed as Dependencies

  handlers:
    - name: Remove Packages Installed as Dependencies
      ansible.builtin.dnf:
        autoremove: true

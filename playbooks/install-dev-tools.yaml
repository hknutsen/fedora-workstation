- name: Install Development Tools
  hosts: localhost
  become: true
  tasks:
    - name: Install tmux
      ansible.builtin.dnf:
        name: tmux
        state: present

    - name: Install Vim
      ansible.builtin.dnf:
        name: vim
        state: present

    # Ref: https://code.visualstudio.com/docs/setup/linux
    - name: Import Microsoft GPG Key
      ansible.builtin.rpm_key:
        key: https://packages.microsoft.com/keys/microsoft.asc
        state: present
    - name: Install Visual Studio Code Repository
      ansible.builtin.copy:
        content: |
          [code]
          name=Visual Studio Code
          baseurl=https://packages.microsoft.com/yumrepos/vscode
          enabled=1
          gpgcheck=1
          gpgkey=https://packages.microsoft.com/keys/microsoft.asc
        dest: /etc/yum.repos.d/vscode.repo
        mode: u=rw,g=r,o=r
    - name: Install Visual Studio Code
      ansible.builtin.dnf:
        name: code
        state: present

    - name: Install GitHub CLI
      ansible.builtin.dnf:
        name: gh
        state: present

    - name: Install uv
      ansible.builtin.dnf:
        name: uv
        state: present

    # Ref: https://docs.fedoraproject.org/en-US/quick-docs/installing-docker/
    - name: Install Docker
      ansible.builtin.dnf:
        name:
          - docker-cli
          - containerd
        state: present
    - name: Install Docker-Compose
      ansible.builtin.dnf:
        name: docker-compose
        state: present

    # Ref: https://docs.docker.com/engine/install/linux-postinstall/
    - name: Create Docker Group
      ansible.builtin.group:
        name: docker
        state: present
    - name: Enable Docker Service
      ansible.builtin.systemd_service:
        name: docker
        state: started
        enabled: true
    - name: Enable containerd Service
      ansible.builtin.systemd_service:
        name: containerd
        state: started
        enabled: true
    - name: Create Docker Configuration Directory
      ansible.builtin.file:
        name: /etc/docker
        state: directory
        owner: root
        group: root
        mode: u=rwx,g=rx,o=rx
    - name: Configure Docker Logging Driver
      ansible.builtin.copy:
        content: |
          {
            "log-driver": "local"
          }
        dest: /etc/docker/daemon.json
        mode: u=rw,g=r,o=r

    # Ref: https://docs.fedoraproject.org/en-US/quick-docs/using-kubernetes-versioned/
    - name: Install Kubernetes Client
      ansible.builtin.dnf:
        name: kubernetes-client
        state: present

    - name: Install Helm
      ansible.builtin.dnf:
        name: helm
        state: present

    - name: Install Azure CLI
      ansible.builtin.dnf:
        name: azure-cli
        state: present

    # Ref: https://developer.hashicorp.com/terraform/install
    - name: Install HashiCorp Repository
      ansible.builtin.get_url:
        url: https://rpm.releases.hashicorp.com/fedora/hashicorp.repo
        dest: /etc/yum.repos.d/hashicorp.repo
        mode: u=rw,g=r,o=r
    - name: Install Terraform
      ansible.builtin.dnf:
        name: terraform
        state: present
